networking:
  port: 9872

runtime:
  num_threads: 8
  queue_depth: 8192
  first_busy_wait: 10000000

gpu:
  queue_depth: 8192

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "1GB"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      # SIZE THIS DELIBERATELY. capacity_limit on an hbm tier is a GPU
      # allocation taken at STARTUP, whatever the workload does, so it is
      # added to peak VRAM before a single page is faulted. An oversized
      # tier does not merely waste memory -- it swamps the measurement the
      # paged path exists to improve.
      #
      # Measured in LBANN: with this tier at 1024MB the paged path peaked at
      # 1238 MiB on a model whose weights were 2 MiB, against 158 MiB for
      # keeping the weights resident, and the integration read as a large
      # LOSS. At 64MB the same run peaks at 278 MiB, and at a 1 GiB weight
      # matrix it is 366 MiB against 4298 MiB resident -- an 11.7x saving.
      #
      # The tier still has to exist: paged blobs prefer it, and it is what
      # keeps hot pages off the host. Size it at a few multiples of the page
      # cache (nblocks * slots * page_bytes), not at a fraction of the GPU.
      - path: "hbm::etn_hbm"
        bdev_type: "hbm"
        capacity_limit: "64MB"
        score: 1.0
      - path: "ram::etn_ram"
        bdev_type: "ram"
        capacity_limit: "4096MB"
        score: 0.2
    dpe:
      dpe_type: "max_bw"
